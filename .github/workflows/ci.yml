name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude aneural-gui --all-targets -- -D warnings
      - run: cargo test --workspace --exclude aneural-gui
      # The marketplace's TLS must stay on `ring`. `aws-lc-rs` needs cmake and
      # NASM, which would break the napi cross-build for windows-msvc.
      - name: rustls uses ring, not aws-lc-rs
        run: |
          if cargo tree -p aneural-registry -e normal | grep -q aws-lc; then
            echo "aneural-registry pulled in aws-lc-rs; pin ureq/rustls back to ring" >&2
            exit 1
          fi
      - run: cargo check -p aneural-gui

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @aneural/core build:debug
      # the CLI typechecks against @aneural/mcp's emitted declarations
      - run: pnpm --filter @aneural/mcp build
      - run: pnpm -r typecheck
      - run: pnpm --filter aneural build
      - run: pnpm -r test
